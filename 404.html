<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena – Caltucalor</title>
<meta name="theme-color" content="#090c11">
<link rel="icon" href="/caltucalor/img/ikona.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("/caltucalor/fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; font-display: swap; src: url("/caltucalor/fonts/Inter-ExtraBold.woff2") format("woff2"); }
  :root { --bg: #090c11; --surface: #131821; --hairline: #232b39; --text: #dce2ec; --dim: #8c96aa; --accent: #48d4a0; --accent-ink: #062418; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    color: var(--text); background: radial-gradient(700px 420px at 50% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%), var(--bg);
    font: 16px/1.6 Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; text-align: center;
  }
  .lcd {
    display: inline-block; margin: 0 0 26px; padding: 18px 28px; border-radius: 16px; background: #000;
    border: 1px solid var(--hairline); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .lcd small { display: block; text-align: right; color: var(--dim); font-size: 15px; }
  .lcd b { display: block; font-size: clamp(54px, 14vw, 88px); line-height: 1; font-weight: 800; color: var(--accent); letter-spacing: -0.04em; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0 0 24px; color: var(--dim); }
  a.btn {
    display: inline-block; font-weight: 800; color: var(--accent-ink); background: var(--accent); text-decoration: none;
    padding: 12px 22px; border-radius: 12px;
  }
</style>
</head>
<body>
  <main>
    <div class="lcd" aria-hidden="true"><small>stránka ÷ 0</small><b>Error</b></div>
    <h1>Tahle stránka neexistuje</h1>
    <p>Kalkulačka na tuhle adresu nic nenašla.</p>
    <a class="btn" href="/caltucalor/">Zpět na Caltucalor</a>
  </main>
</body>
</html>
